<script>
  /* Evita un ReferenceError cuando la vista previa bloquea o tarda en cargar
     proj4js-combined.js. En el geovisor normal la definición se registra en
     cuanto Proj4js está disponible. */
  (function registerCustomProjection() {
    var definition = "+proj=longlat +datum=WGS84 +no_defs";

    if (window.Proj4js && window.Proj4js.defs) {
      window.Proj4js.defs["EPSG:9102008"] = definition;
      return;
    }

    window.addEventListener('load', function () {
      if (window.Proj4js && window.Proj4js.defs) {
        window.Proj4js.defs["EPSG:9102008"] = definition;
      } else if (window.console && console.warn) {
        console.warn('[SIGEX] proj4js-combined.js no se cargó; se omitió EPSG:9102008.');
      }
    }, { once: true });
  })();
</script>
