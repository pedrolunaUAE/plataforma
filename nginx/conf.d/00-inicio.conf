server {
    listen 80 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /cgi-bin/ {
        set $mapserver mxsig-mapserver:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$mapserver;
        proxy_read_timeout 300s;
    }

    location /mdmservices/ {
        set $mdmservices mxsig-mdmservices:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$mdmservices;
        proxy_read_timeout 300s;
    }

    location /mdmSearchEngine/ {
        set $tomcat mxsig-tomcat:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$tomcat;
        proxy_read_timeout 300s;
    }

    location /mdmexport/ {
        set $tomcat_export mxsig-tomcat:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$tomcat_export;
        proxy_read_timeout 300s;
    }

    location = /sig { return 404; }
    location /sig/ { return 404; }

    location = /ovie { return 301 /ovie/; }
    location = /ovie/ {
        root /var/www;
        try_files /ovie/index.html =404;
    }
    location /ovie/ {
        root /var/www;
        try_files $uri @ovie_api;

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            root /var/www;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }
    location @ovie_api {
        set $ovie_api ovie-services:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$ovie_api;
        proxy_read_timeout 300s;
    }

    location = /iplanay { return 301 /iplanay/; }
    location /iplanay/api/ {
        set $iplanay_api plataforma-iplanay:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$iplanay_api;
        proxy_read_timeout 120s;
    }
    location /iplanay/ {
        alias /var/www/iplanay/;
        index index.html;
    }

    location = /geovisor { return 301 /geovisor/; }
    location /geovisor/ {
        alias /var/www/mxsig/geovisor_compostela/;
        index index.html;
    }

    location = /mdm-client { return 301 /mdm-client/; }
    location /mdm-client/ {
        alias /var/www/mxsig/mdm-client/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
