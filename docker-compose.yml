# Plataforma compartida: un servidor web y una base.
# Cada aplicacion (OVIE, MxSIG, la clase) sigue en su propia carpeta
# y se une a la red "plataforma".

name: plataforma

services:
  postgres:
    build: ./postgres
    image: plataforma-postgres:17-plr
    container_name: plataforma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      OVIE_DB_NAME: ${OVIE_DB_NAME}
      OVIE_DB_USER: ${OVIE_DB_USER}
      OVIE_DB_PASSWORD: ${OVIE_DB_PASSWORD}
      IPLANAY_DB_PASSWORD: ${IPLANAY_DB_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - plataforma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: plataforma-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ${OVIE_CLIENT_DIR}:/var/www/ovie:ro
      - ${MXSIG_CLIENT_DIR}:/var/www/mxsig:ro
      - ./proyectos/iplanay/geovisor:/var/www/iplanay:ro
    networks:
      - plataforma
    depends_on:
      postgres:
        condition: service_healthy

  iplanay:
    build: ./proyectos/iplanay/visor
    image: plataforma-iplanay:1
    container_name: plataforma-iplanay
    restart: unless-stopped
    environment:
      IPLANAY_DB_HOST: postgres
      IPLANAY_DB_PORT: "5432"
      IPLANAY_DB_NAME: iplanay
      IPLANAY_DB_USER: ${IPLANAY_DB_USER:-iplanay_lectura}
      IPLANAY_DB_PASSWORD: ${IPLANAY_DB_PASSWORD}
      IPLANAY_PORT: "8080"
      IPLANAY_PDFS: /pdfs
    volumes:
      - ./proyectos/iplanay/visor:/app
      - ./proyectos/iplanay/PDFs:/pdfs:ro
    networks:
      - plataforma
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plataforma-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      TZ: America/Mexico_City
    expose:
      - "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - plataforma
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: plataforma-proxy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/conf.d:/etc/nginx/conf.d:ro
    networks:
      - plataforma
    depends_on:
      - web
      - pgadmin

networks:
  plataforma:
    name: plataforma

volumes:
  postgres_data:
  pgadmin_data:
